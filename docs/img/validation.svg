<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e6e5e0; --band:#cde2fb; --s1:#2a78d6; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) {
