<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Terra Analog: scanning Earth for places that resemble Moon and Mars base sites">
<style>
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .title { fill: #f0efec; font-size: 46px; font-weight: 700; letter-spacing: .5px; }
  .tag { fill: #c3c2b7; font-size: 16px; }
  .chip { fill: #8f8e86; font-size: 12px; letter-spacing: 1.5px; }
  .star { fill: #fff; animation: tw 3s ease-in-out infinite; }
  .s2 { animation-delay: .8s } .s3 { animation-delay: 1.6s } .s4 { animation-delay: 2.3s }
  @keyframes tw { 0%,100% { opacity: .15 } 50% { opacity: .9 } }
  .path { fill: none; stroke: #5598e7; stroke-width: 1.5; stroke-dasharray: 4 6; opacity: .55; animation: flow 1.6s linear infinite; }
  .path.m { stroke: #eb6834; }
  @keyframes flow { to { stroke-dashoffset: -20 } }
  .scan { animation: scan 4s ease-in-out infinite; transform-origin: 160px 130px; }
  @keyframes scan { 0% { transform: rotate(-40deg) } 50% { transform: rotate(40deg) } 100% { transform: rotate(-40deg) } }
  .ping { fill: none; stroke: #f0efec; stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: ping 2.4s ease-out infinite; }
  .p2 { animation-delay: .8s } .p3 { animation-delay: 1.6s }
  @keyframes ping { 0% { transform: scale(.4); opacity: .9 } 100% { transform: scale(2.6); opacity: 0 } }
  .spin { animation: spin 40s linear infinite; transform-origin: 160px 130px; }
  @keyframes spin { to { transform: rotate(360deg) } }
  .float { animation: fl 6s ease-in-out infinite; }
  .float.b { animation-delay: -3s; }
  @keyframes fl { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1424"/><stop offset="1" stop-color="#1a1a19"/></linearGradient>
  <radialGradient id="earth" cx=".35" cy=".35" r=".8"><stop offset="0" stop-color="#3987e5"/><stop offset="1" stop-color="#0d366b"/></radialGradient>
  <radialGradient id="moon" cx=".35" cy=".35" r=".8"><stop offset="0" stop-color="#e6e5e0"/><stop offset="1" stop-color="#6b6a65"/></radialGradient>
  <radialGradient id="mars" cx=".35" cy=".35" r=".8"><stop offset="0" stop-color="#f08a5d"/><stop offset="1" stop-color="#8a2f10"/></radialGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9ec5f4" stop-opacity=".5"/><stop offset="1" stop-color="#9ec5f4" stop-opacity="0"/></linearGradient>
  <clipPath id="ec"><circle cx="160" cy="130" r="78"/></clipPath>
</defs>
<rect width="900" height="260" rx="16" fill="url(#sky)"/>
<circle class="star" cx="60" cy="40" r="1.4"/><circle class="star s2" cx="300" cy="30" r="1.1"/>
<circle class="star s3" cx="420" cy="220" r="1.3"/><circle class="star s4" cx="700" cy="36" r="1.2"/>
<circle class="star s2" cx="850" cy="210" r="1.4"/><circle class="star" cx="560" cy="18" r="1"/>
<circle class="star s3" cx="40" cy="220" r="1.1"/><circle class="star s4" cx="270" cy="235" r="1"/>

<!-- Earth with rotating land and scanning beam -->
<circle cx="160" cy="130" r="78" fill="url(#earth)"/>
<g clip-path="url(#ec)" opacity=".55" fill="#1baf7a">
  <g class="spin">
    <path d="M100 90 q20 -18 45 -6 q12 14 -6 26 q-22 6 -39 -20z"/>
    <path d="M168 70 q26 -4 38 18 q-4 22 -30 18 q-16 -10 -8 -36z"/>
    <path d="M130 150 q24 -10 34 14 q-6 26 -28 22 q-14 -14 -6 -36z"/>
    <path d="M190 150 q22 4 26 22 q-14 14 -30 2z"/>
  </g>
</g>
<g clip-path="url(#ec)"><path class="scan" d="M160 130 L250 95 L250 165 Z" fill="url(#beam)"/></g>
<circle class="ping" cx="128" cy="96" r="5"/>
<circle class="ping p2" cx="186" cy="160" r="5"/>
<circle class="ping p3" cx="182" cy="86" r="5"/>

<!-- Paths to Moon and Mars -->
<path class="path" d="M232 96 C 380 -20, 620 0, 760 66"/>
<path class="path m" d="M232 168 C 380 285, 620 270, 764 198"/>
<g class="float"><circle cx="790" cy="72" r="30" fill="url(#moon)"/><circle cx="782" cy="64" r="5" fill="#8a8984" opacity=".6"/><circle cx="800" cy="84" r="3.5" fill="#8a8984" opacity=".6"/></g>
<g class="float b"><circle cx="790" cy="190" r="26" fill="url(#mars)"/><circle cx="798" cy="198" r="4" fill="#5a1e0a" opacity=".5"/></g>
<text class="chip" x="790" y="122" text-anchor="middle">MOON</text>
<text class="chip" x="790" y="236" text-anchor="middle">MARS</text>

<text class="title" x="300" y="128">Terra Analog</text>
<text class="tag" x="302" y="158">Finding the places on Earth that behave most like</text>
<text class="tag" x="302" y="180">future Moon and Mars base sites, using NASA data</text>
<text class="chip" x="302" y="82">NASA SPACE APPS 2026 · TEAM LOGOS</text>
</svg>
